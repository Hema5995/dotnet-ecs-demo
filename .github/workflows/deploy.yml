name: Build and Deploy to ECS

on:
  push:
    branches: [ main ]

permissions:
  id-token: write   # required for OIDC auth to AWS
  contents: read

env:
  ECS_CLUSTER: aspnet-cluster
  ECS_SERVICE: aspnet-service
  CONTAINER_NAME: aspnet-container   # must exactly match the container name in task-definition.json

jobs:
  deploy:
    runs-on: windows-2022   # windows-2019 was retired by GitHub on 2025-06-30; windows-2022 can still build ltsc2019-tagged images fine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: TEMP DEBUG - check secret length
        run: |
          Write-Host "AWS_ROLE_ARN length: $($env:SECRET_VAL.Length)"
          Write-Host "AWS_ROLE_ARN value: [$env:SECRET_VAL]"
        env:
          SECRET_VAL: ${{ secrets.AWS_ROLE_ARN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: aspnet-demo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build with commit SHA and latest tags
          docker build -t "${{ steps.ecr-login.outputs.registry }}/aspnet-demo:${{ github.sha }}" -t "${{ steps.ecr-login.outputs.registry }}/aspnet-demo:latest" .

          # Push both tags to ECR
          docker push "${{ steps.ecr-login.outputs.registry }}/aspnet-demo:${{ github.sha }}"
          docker push "${{ steps.ecr-login.outputs.registry }}/aspnet-demo:latest"

          # Set image env for subsequent steps
          echo "IMAGE=${{ steps.ecr-login.outputs.registry }}/aspnet-demo:${{ github.sha }}" >> $env:GITHUB_ENV
      
      - name: Fill in new image ID in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
